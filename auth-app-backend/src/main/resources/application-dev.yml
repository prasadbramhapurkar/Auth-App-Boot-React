#Development versions of configurations

server:
  port: 8083

#Database configuration/connection

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth-app
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: trues
    show-sql: true


logging:
  level:
    org.springframework.security: DEBUG